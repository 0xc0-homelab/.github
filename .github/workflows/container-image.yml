# Reusable: build a repo's container image and, on its default branch, push it
# to GHCR as ghcr.io/<owner>/<repo>. Trunk-based: every commit on main is an
# immutable, deployable image, tagged sha-<7> and main; there is no latest and
# no release tag. Deployments pin the digest this job writes to its summary.
# On a PR the image is built and not pushed, which checks the Dockerfile.
# GHCR takes the job's GITHUB_TOKEN: the caller grants packages: write, and
# no secret is involved.
name: container-image

on:
  workflow_call:
    inputs:
      context:
        description: Build context, relative to the repo root.
        type: string
        default: .
      file:
        description: Dockerfile, relative to the repo root.
        type: string
        default: Dockerfile
      platforms:
        description: Target platforms, comma separated.
        type: string
        default: linux/amd64

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}

      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: ${{ inputs.platforms }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: summary
        if: env.PUSH == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image pushed"
            echo
            echo "Pin it in gitops as:"
            echo
            echo '```'
            echo "$IMAGE:sha-${GITHUB_SHA::7}@$DIGEST"
            echo '```'
            echo
            echo "Tags:"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
