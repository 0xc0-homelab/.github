# Runs on every PR, with no paths filter on purpose: if this check becomes
# required, a PR the workflow never started for could never merge. PRs that
# touch no OpenTofu finish green without planning (see tofu-plan.yml).
name: org-plan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    # From main, never the PR's copy: the runner group only admits the
    # reusable workflows as they are on main.
    uses: 0xc0-homelab/.github/.github/workflows/tofu-plan.yml@main
    with:
      working-directory: environments/prod
      # Also re-plan when the tofu workflows themselves change.
      paths: '^(environments/|modules/|mise\.toml$|\.github/workflows/(tofu|org)-)'
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
