# Runs on every PR, with no paths filter on purpose: the plan check is
# required, so it must report on every PR, or one the workflow never started
# for could never merge. PRs that touch no OpenTofu finish green without
# planning (see tofu-plan.yml).
name: org-plan

on:
  pull_request:
    branches: [main]

# id-token: tofu-plan asks for it (Vault logins); this root does not use it.
permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  plan:
    # From main, never the PR's copy: the runner group only admits the
    # reusable workflows as they are on main.
    uses: 0xc0-homelab/.github/.github/workflows/tofu-plan.yml@main
    with:
      working-directory: environments/prod
      # The self-hosted runners on the CI VMs, inside the network.
      runs-on: '{"group": "homelab", "labels": "homelab"}'
      # Also re-plan when the tofu workflows themselves change.
      paths: '^(environments/|modules/|mise\.toml$|\.github/workflows/(tofu|org)-)'
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
