# Reusable: fmt, validate and plan an OpenTofu root, and post the plan on the PR.
# Called by this repo and by any other repo in the org.
#
# The job runs on every PR, so its check always reports and can be required.
# When a PR touches nothing matching `paths`, it finishes green right away,
# without init and without reaching the state backend.
name: tofu-plan

on:
  workflow_call:
    inputs:
      working-directory:
        description: OpenTofu root to plan, relative to the repo root.
        type: string
        required: true
      paths:
        description: Extended regex over changed file paths. A PR touching none of them skips the plan.
        type: string
        default: '^(environments/|modules/|mise\.toml$)'
    # Each root gets only the secrets its providers need: the GitHub App for the
    # org root, Proxmox for infrastructure. The state credentials are always needed.
    secrets:
      GH_APP_ID:
        required: false
      GH_APP_INSTALLATION_ID:
        required: false
      GH_APP_PRIVATE_KEY:
        required: false
      PROXMOX_VE_ENDPOINT:
        required: false
      PROXMOX_VE_API_TOKEN:
        required: false
      TF_STATE_ACCESS_KEY:
        required: true
      TF_STATE_SECRET_KEY:
        required: true

jobs:
  tofu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # One plan at a time per PR and root. A newer push replaces a plan that has
    # not started yet. A running plan is never cancelled: killing tofu mid-run
    # can leave the state lock behind.
    concurrency:
      group: tofu-plan-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.working-directory }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Wait for the state lock instead of failing: an apply or another PR's
      # plan may hold it for a moment.
      TF_CLI_ARGS_plan: "-lock-timeout=5m"
      TF_VAR_github_app_id: ${{ secrets.GH_APP_ID }}
      TF_VAR_github_app_installation_id: ${{ secrets.GH_APP_INSTALLATION_ID }}
      TF_VAR_github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
      PROXMOX_VE_ENDPOINT: ${{ secrets.PROXMOX_VE_ENDPOINT }}
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PATHS: ${{ inputs.paths }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "tofu=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if printf '%s\n' "$changed" | grep -Eq "$PATHS"; then
            echo "tofu=true" >> "$GITHUB_OUTPUT"
            echo "OpenTofu-relevant changes:"; printf '%s\n' "$changed" | grep -E "$PATHS"
          else
            echo "tofu=false" >> "$GITHUB_OUTPUT"
            echo "No file matches '$PATHS'. Plan skipped."
          fi

      # Tool versions come from mise.toml, same as on the laptop.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.changes.outputs.tofu == 'true'

      - name: fmt
        if: steps.changes.outputs.tofu == 'true'
        run: tofu fmt -check -recursive -no-color

      - name: init
        if: steps.changes.outputs.tofu == 'true'
        run: tofu -chdir="${{ inputs.working-directory }}" init -no-color

      - name: validate
        if: steps.changes.outputs.tofu == 'true'
        run: tofu -chdir="${{ inputs.working-directory }}" validate -no-color

      - name: plan
        if: steps.changes.outputs.tofu == 'true'
        run: |
          tofu -chdir="${{ inputs.working-directory }}" plan -no-color -out=tfplan
          tofu -chdir="${{ inputs.working-directory }}" show -no-color tfplan > plan.txt

      - name: comment
        if: github.event_name == 'pull_request' && steps.changes.outputs.tofu == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ROOT: ${{ inputs.working-directory }}
        with:
          script: |
            const fs = require('fs');
            const root = process.env.ROOT;
            const marker = `<!-- tofu-plan:${root} -->`;
            let plan = fs.readFileSync('plan.txt', 'utf8');
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n\n… truncated, see the job log.';
            }
            const body = `${marker}\n### tofu plan — \`${root}\`\n\n\`\`\`\n${plan}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
