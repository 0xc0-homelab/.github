# Reusable: fmt, validate and plan an OpenTofu root, and post the plan on the PR.
# Called by this repo and by any other repo in the org.
#
# The job runs on every PR, so its check always reports and can be required.
# When a PR touches nothing matching `paths`, it finishes green right away,
# without init and without reaching the state backend.
name: tofu-plan

on:
  workflow_call:
    inputs:
      working-directory:
        description: OpenTofu root to plan, relative to the repo root.
        type: string
        required: true
      paths:
        description: Extended regex over changed file paths. A PR touching none of them skips the plan.
        type: string
        default: '^(environments/|modules/|mise\.toml$)'
      secrets-file:
        description: SOPS-encrypted file with every secret the root needs, relative to the repo root.
        type: string
        default: secrets/tofu.sops.yaml
      tools:
        description: mise tools to install. Only these — a broken, unrelated tool in the repo's mise.toml must not block a plan or an apply.
        type: string
        default: opentofu sops jq
    # The only secret: this repo's CI age key. Everything else is decrypted from
    # secrets-file, so each repo's CI can read only its own secrets.
    secrets:
      SOPS_AGE_KEY:
        required: true

jobs:
  tofu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # One plan at a time per PR and root. A newer push replaces a plan that has
    # not started yet. A running plan is never cancelled: killing tofu mid-run
    # can leave the state lock behind.
    concurrency:
      group: tofu-plan-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.working-directory }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Wait for the state lock instead of failing: an apply or another PR's
      # plan may hold it for a moment.
      TF_CLI_ARGS_plan: "-lock-timeout=5m"
      ROOT: ${{ inputs.working-directory }}
      SECRETS_FILE: ${{ inputs.secrets-file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PATHS: ${{ inputs.paths }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "tofu=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if printf '%s\n' "$changed" | grep -Eq "$PATHS"; then
            echo "tofu=true" >> "$GITHUB_OUTPUT"
            echo "OpenTofu-relevant changes:"; printf '%s\n' "$changed" | grep -E "$PATHS"
          else
            echo "tofu=false" >> "$GITHUB_OUTPUT"
            echo "No file matches '$PATHS'. Plan skipped."
          fi

      # Tool versions come from mise.toml, same as on the laptop.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: steps.changes.outputs.tofu == 'true'
        with:
          install_args: ${{ inputs.tools }}

      # The CI key goes where sops looks for it on Linux. Decrypted values are
      # not GitHub secrets, so GitHub would not mask them: mask every line.
      - name: secrets
        if: steps.changes.outputs.tofu == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          key_file="${SOPS_AGE_KEY_FILE:-$HOME/.config/sops/age/keys.txt}"
          mkdir -p "$(dirname "$key_file")"
          ( umask 077 && printf '%s\n' "$SOPS_AGE_KEY" > "$key_file" )
          sops decrypt --output-type json "$SECRETS_FILE" | jq -r '.[] | strings' |
            while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done

      - name: fmt
        if: steps.changes.outputs.tofu == 'true'
        run: tofu fmt -check -recursive -no-color

      - name: init
        if: steps.changes.outputs.tofu == 'true'
        run: sops exec-env "$SECRETS_FILE" 'tofu -chdir="$ROOT" init -no-color'

      - name: validate
        if: steps.changes.outputs.tofu == 'true'
        run: tofu -chdir="$ROOT" validate -no-color

      - name: plan
        if: steps.changes.outputs.tofu == 'true'
        run: |
          sops exec-env "$SECRETS_FILE" 'tofu -chdir="$ROOT" plan -no-color -out=tfplan'
          sops exec-env "$SECRETS_FILE" 'tofu -chdir="$ROOT" show -no-color tfplan' > plan.txt

      - name: comment
        if: github.event_name == 'pull_request' && steps.changes.outputs.tofu == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const root = process.env.ROOT;
            const marker = `<!-- tofu-plan:${root} -->`;
            let plan = fs.readFileSync('plan.txt', 'utf8');
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n\n… truncated, see the job log.';
            }
            const body = `${marker}\n### tofu plan — \`${root}\`\n\n\`\`\`\n${plan}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
