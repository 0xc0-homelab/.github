# Reusable: run a repo's Ansible playbooks, the ones the change affects, each
# in a job of its own, in parallel. On a PR, each one with --check --diff, as
# the review; on a push to main, for real, once the operator
# approves the environment: that approval is the human launching the run.
# The caller holds the triggers and paths, and provides the wrapper that runs
# ansible-playbook with the repo's secrets in the environment.
name: ansible

on:
  workflow_call:
    inputs:
      playbooks:
        description: Playbooks to run, relative to ansible-dir, one per line. Only those the change affects run, each in its own job.
        type: string
        required: true
      wrapper:
        description: Script that runs ansible-playbook with the secrets in its environment, relative to the repo root. Takes a playbook and ansible-playbook's arguments.
        type: string
        default: scripts/ansible
      max-parallel:
        description: >-
          How many playbooks run at once. A repo whose playbooks need what an
          earlier one set up passes 1: they then run in the listed order.
        type: number
        default: 10
      ansible-dir:
        description: Directory holding playbooks/ and roles/, relative to the repo root, where the wrapper runs them.
        type: string
        default: ansible
      secrets-file:
        description: SOPS-encrypted file holding the SSH key, relative to the repo root.
        type: string
        default: secrets/ansible.sops.yaml
      ssh-key-path:
        description: Path of the CI SSH private key inside secrets-file, as SOPS extracts it.
        type: string
        default: '["ci_ssh_private_key"]'
      tofu-root:
        description: OpenTofu root to initialise first, when the wrapper reads its outputs. Empty skips it.
        type: string
        default: ""
      tofu-secrets-file:
        description: SOPS-encrypted file with the secrets the OpenTofu root needs.
        type: string
        default: secrets/tofu.sops.yaml
      environment:
        description: Environment whose reviewers must approve a real run.
        type: string
        default: production
      tools:
        description: mise tools to install. Only these — a broken, unrelated tool in the repo's mise.toml must not block a run.
        type: string
        default: ansible opentofu sops jq uv
      runs-on:
        description: >-
          Where the jobs run, as JSON. Defaults to the self-hosted runners on
          the CI VMs, which reach every VM over SSH. A PR from a fork always
          runs on "ubuntu-latest", never on the self-hosted ones.
        type: string
        default: '{"group": "homelab", "labels": "homelab"}'
      vault-addr:
        description: Vault's address. Empty, the job does not log in to Vault.
        type: string
        default: ""
      vault-role:
        description: Vault JWT auth role the job logs in with, through GitHub's OIDC token. Required with vault-addr.
        type: string
        default: ""
      vault-secrets:
        description: >-
          The secrets the job reads from Vault once logged in, in
          hashicorp/vault-action's format ("<path> <key> | <ENV_VAR>;" per
          line): each lands in the job's environment, masked. With it, the
          repo needs no SOPS file.
        type: string
        default: ""
      ssh-key-env:
        description: With the secrets in Vault, the environment variable (one of vault-secrets) that holds the CI SSH private key. Empty, the key comes from secrets-file.
        type: string
        default: ""
    # The caller's CI age key, while its secrets are still in SOPS. A repo whose
    # secrets are all in Vault passes none, and the SOPS steps are skipped.
    secrets:
      SOPS_AGE_KEY:
        required: false

# id-token: the OIDC token a Vault login presents. The caller must grant it
# too, even when it does not use Vault.
permissions:
  contents: read
  id-token: write

jobs:
  # Only the playbooks the change affects: the playbook itself, or one naming a
  # changed role. Anything else changed (inventory, configuration, the wrapper,
  # the caller) runs them all. No secrets: GitHub's runners.
  select:
    runs-on: ubuntu-latest
    outputs:
      playbooks: ${{ steps.select.outputs.playbooks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: select
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          PLAYBOOKS: ${{ inputs.playbooks }}
          ANSIBLE_DIR: ${{ inputs.ansible-dir }}
        run: |
          # The changed files: against the PR's base, or since the push's
          # previous head. Without one, every playbook runs.
          all=1
          if [ "$EVENT" = pull_request ]; then
            changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"; all=0
          elif [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"; all=0
          fi
          mapfile -t playbooks < <(printf '%s\n' "$PLAYBOOKS" | grep -v '^$')
          declare -A hit=()
          while IFS= read -r f; do
            [ "$all" = 0 ] || break
            [ -n "$f" ] || continue
            case "$f" in
              "$ANSIBLE_DIR"/playbooks/*)
                # A playbook outside the list runs nowhere here.
                hit["${f#"$ANSIBLE_DIR"/}"]=1 ;;
              "$ANSIBLE_DIR"/roles/*/*)
                # Every playbook naming the role, as a role or an include.
                # Roles carry no meta dependencies; one that does would need
                # its dependants found here too.
                role="${f#"$ANSIBLE_DIR"/roles/}"; role="${role%%/*}"
                for p in "${playbooks[@]}"; do
                  if grep -Eq "^[[:space:]-]*(role|name):[[:space:]]*[\"']?$role[\"']?[[:space:]]*$" "$ANSIBLE_DIR/$p"; then hit["$p"]=1; fi
                done ;;
              # Inventory, configuration, the wrapper, the caller: all of them.
              *) all=1 ;;
            esac
          done <<< "${changed:-}"
          selected=()
          for p in "${playbooks[@]}"; do
            if [ "$all" = 1 ] || [ -n "${hit[$p]:-}" ]; then selected+=("$p"); fi
          done
          if [ "${#selected[@]}" = 0 ]; then echo "No playbook is affected by this change."; else printf 'Runs: %s\n' "${selected[@]}"; fi
          # A JSON array, in the listed order: the matrix of the next job.
          echo "playbooks=$(printf '%s\n' "${selected[@]}" | jq -Rsc 'split("\n") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  ansible:
    needs: select
    # Nothing affected: no run, and no approval asked for.
    if: needs.select.outputs.playbooks != '[]'
    # One job per playbook. A failure does not stop the others: each playbook
    # holds its own hosts.
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max-parallel }}
      matrix:
        playbook: ${{ fromJSON(needs.select.outputs.playbooks) }}
    # Fork PRs never reach the self-hosted runners: their code would run inside
    # the network. On GitHub's runners they get no secrets and fail harmlessly.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    # Only the real run waits for approval; the PR's dry run is the review.
    environment: ${{ github.event_name == 'push' && inputs.environment || '' }}
    # One run at a time per playbook, dry or real: two touching the same VMs at
    # once would race. A running one is never cancelled, or it leaves a VM
    # half-configured.
    concurrency:
      group: ansible-${{ github.repository }}-${{ matrix.playbook }}
      cancel-in-progress: false
    env:
      PLAYBOOK: ${{ matrix.playbook }}
      WRAPPER: ${{ inputs.wrapper }}
      SECRETS_FILE: ${{ inputs.secrets-file }}
      SSH_KEY_PATH: ${{ inputs.ssh-key-path }}
      TOFU_ROOT: ${{ inputs.tofu-root }}
      TOFU_SECRETS_FILE: ${{ inputs.tofu-secrets-file }}
      VAULT_ADDR: ${{ inputs.vault-addr }}
      SSH_KEY_ENV: ${{ inputs.ssh-key-env }}
      SOPS_ENABLED: ${{ secrets.SOPS_AGE_KEY != '' }}
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ANSIBLE_FORCE_COLOR: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ${{ inputs.tools }}

      # Vault: log in with this job's GitHub OIDC token (JWT auth), and read
      # vault-secrets into the job's environment, masked. No Vault credential is
      # stored anywhere.
      - name: vault
        if: inputs.vault-addr != ''
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ inputs.vault-addr }}
          method: jwt
          path: jwt
          role: ${{ inputs.vault-role }}
          jwtGithubAudience: ${{ inputs.vault-addr }}
          exportToken: true
          secrets: ${{ inputs.vault-secrets }}

      # While the caller's secrets are in SOPS: the CI age key goes to the job's
      # temporary directory, which the runner wipes when the job ends (on a
      # self-hosted runner, $HOME outlives the job), and every decrypted value
      # is masked, line by line.
      - name: sops
        if: env.SOPS_ENABLED == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/age-key.txt"
          ( umask 077 && printf '%s\n' "$SOPS_AGE_KEY" > "$key_file" )
          echo "SOPS_AGE_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          export SOPS_AGE_KEY_FILE="$key_file"
          for f in "$SECRETS_FILE" ${TOFU_ROOT:+"$TOFU_SECRETS_FILE"}; do
            sops decrypt --output-type json "$f" | jq -r '.[] | strings' |
              while IFS= read -r line; do if [ -n "$line" ]; then echo "::add-mask::$line"; fi; done
          done

      # The SSH key, from Vault or from SOPS, to the job's temporary directory.
      - name: ssh
        run: |
          ssh_key="$RUNNER_TEMP/ssh-key"
          if [ -n "$SSH_KEY_ENV" ]; then
            ( umask 077 && printf '%s\n' "${!SSH_KEY_ENV}" > "$ssh_key" )
          else
            ( umask 077 && sops decrypt --extract "$SSH_KEY_PATH" "$SECRETS_FILE" > "$ssh_key" )
          fi
          echo "HOMELAB_SSH_KEY_FILE=$ssh_key" >> "$GITHUB_ENV"
          # Host keys, fresh for every job: a VM rebuilt under the same address
          # gets a new one, and a known_hosts kept in the runner's $HOME would
          # refuse it. The runners are ephemeral, so pinning across jobs buys
          # nothing.
          echo "HOMELAB_KNOWN_HOSTS=$RUNNER_TEMP/known_hosts" >> "$GITHUB_ENV"

      - name: init
        if: inputs.tofu-root != ''
        run: |
          if [ -n "${SOPS_AGE_KEY_FILE:-}" ]; then
            sops exec-env "$TOFU_SECRETS_FILE" 'tofu -chdir="$TOFU_ROOT" init -no-color'
          else
            tofu -chdir="$TOFU_ROOT" init -no-color
          fi

      - name: playbook
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then mode=(--diff); else mode=(--check --diff); fi
          echo "$PLAYBOOK ${mode[*]}"
          "$WRAPPER" "$PLAYBOOK" "${mode[@]}"
