# Reusable: validate a repo's Packer templates on a PR, and rebuild the ones a
# push to main affects once the operator approves the environment: a template
# whose directory or baked role changed, and every template cloning one rebuilt.
# A rebuild deletes each template by name and builds it again, in the
# build-order file. VMs are
# full clones: none changes until it is rebuilt with its `rebuild` counter.
#
# The caller holds the triggers and paths, and provides the two scripts the
# build runs: scripts/delete-template <name> and scripts/packer <name> <args>.
name: packer

on:
  workflow_call:
    inputs:
      templates-dir:
        description: Directory holding one Packer template per subdirectory, relative to the repo root.
        type: string
        default: packer
      build-order:
        description: File listing the templates to build, one per line, each after the one it clones.
        type: string
        default: packer/build-order
      roles-dir:
        description: Directory of the Ansible roles the templates' playbook.yml bake, relative to the repo root.
        type: string
        default: ansible/roles
      environment:
        description: Environment whose reviewers must approve a rebuild.
        type: string
        default: production
      secrets-file:
        description: SOPS-encrypted file with the Proxmox token the build needs, relative to the repo root.
        type: string
        default: secrets/tofu.sops.yaml
      tools:
        description: mise tools the build installs. Only these — a broken, unrelated tool in the repo's mise.toml must not block a build.
        type: string
        default: packer sops jq uv ansible
      runs-on:
        description: >-
          Where the build runs, as JSON. Defaults to the self-hosted runners on
          the CI VMs: the build VM is reached over SSH inside the network.
        type: string
        default: '{"group": "homelab", "labels": "homelab"}'
      vault-addr:
        description: Vault's address. Empty, the job does not log in to Vault.
        type: string
        default: ""
      vault-role:
        description: Vault JWT auth role the job logs in with, through GitHub's OIDC token. Required with vault-addr.
        type: string
        default: ""
      vault-secrets:
        description: >-
          The secrets the job reads from Vault once logged in, in
          hashicorp/vault-action's format ("<path> <key> | <ENV_VAR>;" per
          line): each lands in the job's environment, masked. With it, the
          repo needs no SOPS file.
        type: string
        default: ""
    # The caller's CI age key, while its secrets are still in SOPS. A repo whose
    # secrets are all in Vault passes none, and the SOPS steps are skipped.
    secrets:
      SOPS_AGE_KEY:
        required: false

# id-token: the OIDC token a Vault login presents. The caller must grant it
# too, even when it does not use Vault.
permissions:
  contents: read
  id-token: write

jobs:
  # No secrets and no network beyond the plugin downloads: GitHub's runners,
  # fork PRs included.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      TEMPLATES_DIR: ${{ inputs.templates-dir }}
      # packer init looks plugins up through the GitHub API: unauthenticated, a
      # shared runner hits the rate limit and the job fails for nothing.
      PACKER_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: packer

      - name: validate
        env:
          # validate checks the variables' presence, not their values.
          PKR_VAR_proxmox_url: https://example.invalid/api2/json
          PKR_VAR_proxmox_username: validate@pve!validate
          PKR_VAR_proxmox_token: validate
        run: |
          packer fmt -check -recursive "$TEMPLATES_DIR"
          for t in "$TEMPLATES_DIR"/*/; do
            packer init "$t"
            packer validate "$t"
          done

  # The templates the push affects. Anything changed outside a template's
  # directory and the roles (the build order, the scripts, the caller, the
  # tools) rebuilds them all. No secrets: GitHub's runners.
  select:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.select.outputs.templates }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: select
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          TEMPLATES_DIR: ${{ inputs.templates-dir }}
          ROLES_DIR: ${{ inputs.roles-dir }}
          BUILD_ORDER: ${{ inputs.build-order }}
        run: |
          # The changed files since the push's previous head. Without one, or
          # run by hand, every template is rebuilt.
          all=1
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"; all=0
          fi
          mapfile -t order < <(grep -vE '^(#|$)' "$BUILD_ORDER")
          declare -A hit=()
          while IFS= read -r f; do
            [ "$all" = 0 ] || break
            [ -n "$f" ] || continue
            case "$f" in
              "$TEMPLATES_DIR"/*/*)
                t="${f#"$TEMPLATES_DIR"/}"; hit["${t%%/*}"]=1 ;;
              "$ROLES_DIR"/*/*)
                # Every template whose playbook bakes the role.
                role="${f#"$ROLES_DIR"/}"; role="${role%%/*}"
                for t in "${order[@]}"; do
                  if grep -Eq "^[[:space:]-]*(role|name):[[:space:]]*[\"']?$role[\"']?[[:space:]]*$" "$TEMPLATES_DIR/$t/playbook.yml"; then hit["$t"]=1; fi
                done ;;
              # The build order, the scripts, the caller, the tools: all of them.
              *) all=1 ;;
            esac
          done <<< "${changed:-}"
          # A template cloning a rebuilt one is rebuilt after it: the build
          # order lists each after the one it clones, so one pass is enough.
          selected=()
          for t in "${order[@]}"; do
            src="$(sed -nE 's/^[[:space:]]*clone_vm[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$TEMPLATES_DIR/$t"/*.pkr.hcl | head -n1)"
            if [ -n "$src" ] && [ -n "${hit[$src]:-}" ]; then hit["$t"]=1; fi
            if [ "$all" = 1 ] || [ -n "${hit[$t]:-}" ]; then selected+=("$t"); fi
          done
          if [ "${#selected[@]}" = 0 ]; then echo "No template is affected by this change."; else printf 'Rebuilds: %s\n' "${selected[@]}"; fi
          { echo "templates<<EOF"; [ "${#selected[@]}" = 0 ] || printf '%s\n' "${selected[@]}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

  # Inside the network. The runner group admits this workflow only as it is on
  # main, and only a push runs it: a fork's PR never reaches this job. Nothing
  # affected: no build, and no approval asked for.
  build:
    needs: select
    if: github.event_name == 'push' && needs.select.outputs.templates != ''
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    # One build at a time; a running one is never cancelled, or it leaves a
    # half-built VM behind.
    concurrency:
      group: packer-${{ github.repository }}
      cancel-in-progress: false
    env:
      SECRETS_FILE: ${{ inputs.secrets-file }}
      TEMPLATES: ${{ needs.select.outputs.templates }}
      VAULT_ADDR: ${{ inputs.vault-addr }}
      SOPS_ENABLED: ${{ secrets.SOPS_AGE_KEY != '' }}
      # packer init looks plugins up through the GitHub API: unauthenticated, a
      # shared runner hits the rate limit and the job fails for nothing.
      PACKER_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ${{ inputs.tools }}

      # Vault: log in with this job's GitHub OIDC token, and read vault-secrets
      # into the job's environment, masked.
      - name: vault
        if: inputs.vault-addr != ''
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ inputs.vault-addr }}
          method: jwt
          path: jwt
          role: ${{ inputs.vault-role }}
          jwtGithubAudience: ${{ inputs.vault-addr }}
          exportToken: true
          secrets: ${{ inputs.vault-secrets }}

      # The token's secret half is masked on its own: the whole token is, but
      # scripts/packer passes only that half to Packer.
      - name: mask
        if: inputs.vault-addr != ''
        run: |
          if [ -n "${PROXMOX_VE_API_TOKEN:-}" ]; then echo "::add-mask::${PROXMOX_VE_API_TOKEN#*=}"; fi

      # While the caller's secrets are in SOPS: the CI key in the job's
      # temporary directory, and every decrypted value masked, as in tofu-plan.
      - name: secrets
        if: env.SOPS_ENABLED == 'true'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/age-key.txt"
          ( umask 077 && printf '%s\n' "$SOPS_AGE_KEY" > "$key_file" )
          echo "SOPS_AGE_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          export SOPS_AGE_KEY_FILE="$key_file"
          sops decrypt --output-type json "$SECRETS_FILE" | jq -r '.[] | strings' |
            while IFS= read -r line; do if [ -n "$line" ]; then echo "::add-mask::$line"; fi; done
          token="$(sops decrypt --extract '["PROXMOX_VE_API_TOKEN"]' "$SECRETS_FILE")"
          echo "::add-mask::${token#*=}"

      # Each template clones the one before it in the build order. Proxmox never
      # overwrites a template: the old one is deleted by name first.
      - name: build
        run: |
          # A for loop, not while-read: a command in the loop reading stdin
          # would eat the rest of the list.
          for name in $TEMPLATES; do
            echo "::group::$name"
            scripts/delete-template "$name"
            scripts/packer "$name" init
            scripts/packer "$name" build -color=false -var "commit=${GITHUB_SHA::12}"
            echo "::endgroup::"
          done
