# Applies environments/prod after a merge to main, once the operator approves the
# production environment.
name: org-apply

# Only when OpenTofu could change something: a merge that touches no root,
# module or tool version asks for no approval. Run it by hand otherwise.
on:
  push:
    branches: [main]
    paths:
      - 'environments/**'
      - 'modules/**'
      - 'mise.toml'
      - '.github/workflows/tofu-*.yml'
      - '.github/workflows/org-*.yml'
  workflow_dispatch:

# id-token: the job logs in to Vault with GitHub's OIDC token.
permissions:
  contents: read
  id-token: write

jobs:
  apply:
    # From main, like every caller: the runner group only admits the reusable
    # workflows as they are on main.
    uses: 0xc0-homelab/.github/.github/workflows/tofu-apply.yml@main
    with:
      working-directory: environments/prod
      # The self-hosted runners on the CI VMs, inside the network.
      runs-on: '{"group": "homelab", "labels": "homelab"}'
      # Every secret from Vault (ci/github/*, ci/shared/rustfs), with GitHub's
      # OIDC token.
      vault-addr: https://vault.int.0xc0.cc
      vault-role: github
      vault-secrets: |
        ci/data/github/org-app app_id | TF_VAR_github_app_id ;
        ci/data/github/org-app installation_id | TF_VAR_github_app_installation_id ;
        ci/data/github/org-app private_key | TF_VAR_github_app_private_key ;
        ci/data/shared/rustfs access_key_id | AWS_ACCESS_KEY_ID ;
        ci/data/shared/rustfs secret_access_key | AWS_SECRET_ACCESS_KEY ;
