# Applies environments/prod after a merge to main, once the operator approves the
# production environment.
name: org-apply

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    uses: ./.github/workflows/tofu-apply.yml
    with:
      working-directory: environments/prod
      environment: production
    secrets:
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
