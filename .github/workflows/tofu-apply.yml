# Reusable: apply an OpenTofu root inside a protected environment. The job does
# not start until the operator approves it: that approval is the human
# launching the apply.
name: tofu-apply

on:
  workflow_call:
    inputs:
      working-directory:
        description: OpenTofu root to apply, relative to the repo root.
        type: string
        required: true
      environment:
        description: Environment whose reviewers must approve the apply.
        type: string
        default: production
      tools:
        description: mise tools to install. Only these — a broken, unrelated tool in the repo's mise.toml must not block a plan or an apply.
        type: string
        default: opentofu
      runs-on:
        description: >-
          Where the job runs, as JSON. Defaults to the self-hosted runners on
          the CI VMs, inside the network.
        type: string
        default: '{"group": "homelab", "labels": "homelab"}'
      vault-addr:
        description: Vault's address, for a root whose provider talks to Vault. Empty, the job does not log in to Vault.
        type: string
        default: ""
      vault-role:
        description: Vault JWT auth role the job logs in with, through GitHub's OIDC token. Required with vault-addr.
        type: string
        default: ""
      vault-secrets:
        description: >-
          The secrets the job reads from Vault once logged in, in
          hashicorp/vault-action's format ("<path> <key> | <ENV_VAR>;" per
          line): each lands in the job's environment, masked. Every secret
          the job needs comes from here.
        type: string
        default: ""

jobs:
  tofu:
    # Fork PRs never reach the self-hosted runners: the runner group admits
    # this workflow from main, and a fork could call it from a PR of its own.
    # On GitHub's runners they get no secrets and fail harmlessly.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    environment: ${{ inputs.environment }}
    # id-token: the OIDC token a Vault login presents. The caller must grant it
    # too, even when it does not use Vault.
    permissions:
      contents: read
      id-token: write
    # Applies to the same root queue up, oldest first; a running apply is never
    # cancelled. Only one run can wait in the queue: a third merge replaces the
    # waiting one, which is safe because main is linear and the newer commit
    # contains the older one. Every apply re-plans against the live state, so
    # the second of two merges applies on top of the first.
    concurrency:
      group: tofu-apply-${{ github.repository }}-${{ inputs.working-directory }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Wait for a PR plan or a local run to release the state lock.
      TF_CLI_ARGS_plan: "-lock-timeout=10m"
      TF_CLI_ARGS_apply: "-lock-timeout=10m"
      ROOT: ${{ inputs.working-directory }}
      VAULT_ADDR: ${{ inputs.vault-addr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ${{ inputs.tools }}

      # Vault: log in with this job's GitHub OIDC token (JWT auth). Vault checks
      # the token's repository and ref against the role; no Vault credential is
      # stored anywhere. VAULT_TOKEN lands in the job's environment, masked,
      # and expires with the role's TTL.
      - name: vault
        if: inputs.vault-addr != ''
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ inputs.vault-addr }}
          method: jwt
          path: jwt
          role: ${{ inputs.vault-role }}
          jwtGithubAudience: ${{ inputs.vault-addr }}
          exportToken: true
          secrets: ${{ inputs.vault-secrets }}

      - name: init
        run: |
          tofu -chdir="$ROOT" init -no-color

      - name: plan
        run: |
          tofu -chdir="$ROOT" plan -no-color -out=tfplan

      - name: apply
        run: |
          tofu -chdir="$ROOT" apply -no-color tfplan
