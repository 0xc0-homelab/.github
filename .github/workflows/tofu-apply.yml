# Reusable: apply an OpenTofu root inside a protected environment. The job does
# not start until the operator approves it: that approval is the human
# launching the apply.
name: tofu-apply

on:
  workflow_call:
    inputs:
      working-directory:
        description: OpenTofu root to apply, relative to the repo root.
        type: string
        required: true
      environment:
        description: Environment whose reviewers must approve the apply.
        type: string
        default: production
      secrets-file:
        description: SOPS-encrypted file with every secret the root needs, relative to the repo root.
        type: string
        default: secrets/tofu.sops.yaml
      tools:
        description: mise tools to install. Only these — a broken, unrelated tool in the repo's mise.toml must not block a plan or an apply.
        type: string
        default: opentofu sops jq
      runs-on:
        description: >-
          Where the job runs, as JSON: "ubuntu-latest", or {"group": "homelab",
          "labels": "homelab"} for the self-hosted runners on vm-ci. A PR from a
          fork always runs on GitHub's runners, never on the self-hosted ones.
        type: string
        default: '"ubuntu-latest"'
    # The only secret: this repo's CI age key. Everything else is decrypted from
    # secrets-file, so each repo's CI can read only its own secrets.
    secrets:
      SOPS_AGE_KEY:
        required: true

jobs:
  tofu:
    # Fork PRs never reach the self-hosted runners: their code would run inside
    # the network. On GitHub's runners they get no secrets and fail harmlessly.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    # Applies to the same root queue up, oldest first; a running apply is never
    # cancelled. Only one run can wait in the queue: a third merge replaces the
    # waiting one, which is safe because main is linear and the newer commit
    # contains the older one. Every apply re-plans against the live state, so
    # the second of two merges applies on top of the first.
    concurrency:
      group: tofu-apply-${{ github.repository }}-${{ inputs.working-directory }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      # Wait for a PR plan or a local run to release the state lock.
      TF_CLI_ARGS_plan: "-lock-timeout=10m"
      TF_CLI_ARGS_apply: "-lock-timeout=10m"
      ROOT: ${{ inputs.working-directory }}
      SECRETS_FILE: ${{ inputs.secrets-file }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: ${{ inputs.tools }}

      # The CI key goes to the job's temporary directory, which the runner wipes
      # when the job ends: on a self-hosted runner, $HOME outlives the job.
      # Decrypted values are not GitHub secrets, so GitHub would not mask them:
      # mask every line.
      - name: secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          key_file="$RUNNER_TEMP/age-key.txt"
          ( umask 077 && printf '%s\n' "$SOPS_AGE_KEY" > "$key_file" )
          echo "SOPS_AGE_KEY_FILE=$key_file" >> "$GITHUB_ENV"
          export SOPS_AGE_KEY_FILE="$key_file"
          sops decrypt --output-type json "$SECRETS_FILE" | jq -r '.[] | strings' |
            while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done

      - name: init
        run: sops exec-env "$SECRETS_FILE" 'tofu -chdir="$ROOT" init -no-color'

      - name: plan
        run: sops exec-env "$SECRETS_FILE" 'tofu -chdir="$ROOT" plan -no-color -out=tfplan'

      # A self-hosted runner never applies a plan that deletes or replaces its
      # own VM: the job would die mid-apply and leave the state locked. That
      # apply runs from the laptop. On GitHub's runners the hostname matches no
      # VM, so this never fires there.
      - name: guard
        run: |
          host="$(hostname)"
          own="$(sops exec-env "$SECRETS_FILE" 'tofu -chdir="$ROOT" show -json tfplan' |
            jq -r --arg host "$host" '.resource_changes[]?
              | select(.type == "proxmox_virtual_environment_vm")
              | select(.change.actions | index("delete"))
              | select(.change.before.name == $host)
              | .address')"
          if [ -n "$own" ]; then
            echo "::error::This plan deletes or replaces $own, the VM this runner ($host) runs on. Run this apply from the laptop, then re-run this workflow: it will plan no changes."
            exit 1
          fi
          echo "The plan leaves this runner's VM ($host) alone."

      - name: apply
        run: sops exec-env "$SECRETS_FILE" 'tofu -chdir="$ROOT" apply -no-color tfplan'
